substitutions:
  name: room-node
  friendly_name: "Jarvis Room Node"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret ha_api_key

logger:
  level: DEBUG
  hardware_uart: USB_CDC

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO11

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 28
  - file: "gfonts://Roboto"
    id: font_small
    size: 16

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "${friendly_name} Temperature"
      id: room_temperature
      unit_of_measurement: "°F"
      filters:
        - lambda: return x * (9.0/5.0) + 32.0;
    humidity:
      name: "${friendly_name} Humidity"
      id: room_humidity
    update_interval: 30s

  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

display:
  - platform: waveshare_epaper
    cs_pin: GPIO10
    dc_pin: GPIO13
    reset_pin: GPIO14
    busy_pin: GPIO15
    model: 2.90inv2
    full_update_every: 30
    update_interval: 30s
    lambda: |-
      it.fill(COLOR_OFF);
      it.printf(5, 5, id(font_large), "Bedroom");
      if (id(room_temperature).has_state() && id(room_humidity).has_state()) {
        it.printf(5, 45, id(font_large), "%.1f°F  %.0f%%", id(room_temperature).state, id(room_humidity).state);
      } else {
        it.print(5, 45, id(font_large), "Reading...");
      }
